services:
  backend:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: ./src/frontend
    ports:
    - "3000:3000"
    stdin_open: true  
    tty: true
    depends_on:
      - backend
    volumes:
      - ./src/frontend:/app
      - /app/node_modules